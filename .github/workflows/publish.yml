name: Publish to npm

on:
  push:
    tags:
      - '*.*.*'
      - 'v*.*.*'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm (OIDC & Provenance)
    runs-on: ubuntu-latest

    permissions:
      # Required to mint OIDC tokens for npm Trusted Publishing & Provenance attestation
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build package
        run: npm run build

      - name: Run functional tests
        run: npm test

      - name: Publish to npm
        # Option A (OIDC Trusted Publishing): If NPM_TOKEN is not provided, npm uses
        #   the GitHub OIDC token exchange automatically.
        # Option B (Automation Token): If NPM_TOKEN is provided as a secret, it writes
        #   it to .npmrc before publishing.
        # In both cases, --provenance signs the build via GitHub OIDC.
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
          fi
          npm publish --provenance --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
